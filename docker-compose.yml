services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - sqlite_data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:/app/data/prod.db
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    restart: unless-stopped

volumes:
  sqlite_data:
